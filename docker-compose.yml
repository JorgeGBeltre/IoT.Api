services:
  iot-postgres:
    image: postgis/postgis:16-3.4
    container_name: iot-postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB es obligatorio}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      - PGDATA=/var/lib/postgresql/data/pgdata
    # NO se publica el puerto al host: api/worker se conectan por la red interna
    # (iot-postgres-db:5432). Para acceso admin, usar un túnel SSH o un servicio en la red.
    expose:
      - "5432"
    volumes:
      - iot_postgres_data:/var/lib/postgresql/data
      - iot_postgres_backups:/backups
    networks:
      - iot-network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  iot-redis:
    image: redis:7.4-alpine
    container_name: iot-redis-db
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}"]
    # NO se publica al host; accesible sólo por la red interna (iot-redis-db:6379).
    expose:
      - "6379"
    volumes:
      - iot_redis_data:/data
    networks:
      - iot-network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Programador de backup automatizado para PostgreSQL (D-18)
  # Ejecuta pg_dump comprimido periódicamente y rota copias mayores a RETENTION_DAYS
  iot-postgres-backup:
    image: postgres:16-alpine
    container_name: iot-postgres-backup
    restart: unless-stopped
    depends_on:
      iot-postgres:
        condition: service_healthy
    environment:
      - PGHOST=iot-postgres-db
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:?POSTGRES_DB es obligatorio}
      - PGUSER=${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - iot_postgres_backups:/backups
    networks:
      - iot-network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "==> [iot-postgres-backup] Servicio programador iniciado (intervalo: $${BACKUP_INTERVAL_SECONDS}s, retención: $${RETENTION_DAYS}días)."
        mkdir -p /backups
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          echo "==> [iot-postgres-backup] Ejecutando backup automatizado: backup_$${TIMESTAMP}.dump..."
          if pg_dump -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d "$$PGDATABASE" -F c -b -f "/backups/backup_$${TIMESTAMP}.dump"; then
            echo "==> [iot-postgres-backup] Backup exitoso: backup_$${TIMESTAMP}.dump ($$(du -sh /backups/backup_$${TIMESTAMP}.dump | cut -f1))"
            find /backups -name 'backup_*.dump' -mtime "+$$RETENTION_DAYS" -exec rm -f {} +
          else
            echo "==> [iot-postgres-backup] ERROR: Fallo al ejecutar pg_dump"
          fi
          echo "==> [iot-postgres-backup] Próximo backup en $${BACKUP_INTERVAL_SECONDS} segundos..."
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  # El broker MQTT es EMBEBIDO en el proceso iot-api (MQTTnet.Server), no hay
  # broker externo. iot-api publica el puerto 1883 directamente. Ver EmbeddedMqttBroker.

  iot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-backend-api
    restart: unless-stopped
    depends_on:
      iot-postgres:
        condition: service_healthy
      iot-redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:5000"
      # Broker MQTT embebido (dispositivos MQTT 3.1/3.1.1/5)
      - "${MQTT_PORT:-1883}:1883"
      # MQTTS (TLS) OPT-IN: el broker solo escucha aqui si MqttBroker__Tls=true y hay certificado
      # (ver DEVICE-SECURITY.md). Reservar el puerto sin TLS activo es inofensivo.
      - "${MQTTS_PORT:-8883}:8883"
      # Gateway TCP multi-protocolo (un puerto por familia de GPS)
      - "${TCP_GT06_PORT:-5023}:5023"       # GT06/Concox/SEEWORLD R12L-F
      - "${TCP_MICTRACK_PORT:-5024}:5024"   # Mictrack M558G-V2 (dialecto GT06: 0x22/0x26)
      - "${TCP_QUECLINK_PORT:-5027}:5027"   # Queclink @Track
      - "${TCP_COBAN_PORT:-5013}:5013"      # Coban/TK103
      - "${TCP_ISTARTEK_PORT:-5001}:5001"   # iStartek
      - "${TCP_JOINTECH_PORT:-5002}:5002"   # Jointech JT701D
    volumes:
      - iot_logs:/app/logs
      # Almacen de imagenes de firmware. SIN este volumen se borraba al recrear el
      # contenedor y la base de datos quedaba apuntando a binarios inexistentes: la
      # campana OTA fallaba con "archivo fisico no encontrado" y no habia forma de
      # recuperarlo salvo volver a subir cada version.
      - iot_firmware:/app/storage
      # Llaves DataProtection persistentes fuera del contenedor (Item 23)
      - iot_dataprotection:/app/data/keys
      # Certificado del broker MQTTS (opt-in; solo se usa si MqttBroker__Tls=true). Pon el PFX en
      # ./mqtt-certs/broker.pfx en el host. NO se commitea (ver .gitignore). Ver DEVICE-SECURITY.md.
      - ${MQTT_CERTS_DIR:-./mqtt-certs}:/app/mqtt-certs:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      # Runtime: rol de aplicación iot_app (NOBYPASSRLS) → la Row-Level Security por tenant es EFECTIVA (ADR-003 D4).
      - ConnectionStrings__Postgres=Host=iot-postgres-db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB es obligatorio};Username=${APP_DB_USER:-iot_app};Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD es obligatorio}
      - Platform__Rls__Enforce=${RLS_ENFORCE:-true}
      # Admin: migraciones, seeding y aprovisionamiento del rol iot_app (iot_admin, superusuario/BYPASSRLS).
      - ConnectionStrings__PostgresAdmin=Host=iot-postgres-db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB es obligatorio};Username=${POSTGRES_USER:?POSTGRES_USER es obligatorio};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      - ConnectionStrings__Redis=iot-redis-db:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio},abortConnect=false
      - Redis__ConnectionString=iot-redis-db:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio},abortConnect=false
      # Broker MQTT embebido (en proceso). En producción exige ApiKey por dispositivo.
      - MqttBroker__Port=1883
      # Host/dominio público por el que los dispositivos alcanzan el broker (se muestra
      # al operador en las credenciales del dispositivo).
      - MqttBroker__PublicHost=${MQTT_PUBLIC_HOST:-localhost}
      # MQTTS (TLS del broker): OPT-IN. Con MQTT_TLS=true el broker abre ADEMAS el 8883 cifrado
      # usando el certificado montado (default /app/mqtt-certs/broker.pfx). DisablePlaintext=true
      # cierra el 1883 (MQTTS exclusivo). La password del PFX es un SECRETO: via env, nunca en
      # appsettings ni en logs. Los trackers TCP binarios NO usan esto (ver DEVICE-SECURITY.md).
      - MqttBroker__Tls=${MQTT_TLS:-false}
      # Puerto TLS INTERNO del contenedor, fijo en 8883 (igual que MqttBroker__Port=1883).
      # MQTTS_PORT (en el mapeo 'ports' de arriba) solo remapea el puerto del HOST.
      - MqttBroker__TlsPort=8883
      - MqttBroker__TlsCertPath=${MQTT_TLS_CERT_PATH:-/app/mqtt-certs/broker.pfx}
      - MqttBroker__TlsCertKeyPath=${MQTT_TLS_CERT_KEY_PATH:-}
      - MqttBroker__TlsCertPassword=${MQTT_TLS_CERT_PASSWORD:-}
      - MqttBroker__DisablePlaintext=${MQTT_DISABLE_PLAINTEXT:-false}
      - MqttBroker__AllowAnonymous=false
      # Cada cuanto se re-validan las sesiones MQTT YA abiertas. Sin esto, suspender un
      # equipo o rotarle la ApiKey no le cerraba la sesion: seguia dentro hasta reconectar.
      - MqttBroker__AuthRecheckSeconds=${MQTT_AUTH_RECHECK_SECONDS:-60}
      # Credenciales de bootstrap POR TENANT (reemplazan la antigua clave global unica para
      # todos los tenants, MEDIUM-2). Cada clave esta acotada a su tenant: filtrar una no
      # permite inyectar en otro. El seeder las hashea en la entidad Tenant por su codigo.
      # Solo CARIBE-LOG es obligatoria (la organizacion que se da de alta por defecto, arriba).
      # DOM-GLP/SMART-ACT son OPCIONALES (vacias por defecto): solo aplican si tambien das de alta
      # esa organizacion via Bootstrap__Tenants__N__; si quedan vacias, el seeder las omite.
      - MqttBroker__BootstrapCredentials__0__TenantCode=CARIBE-LOG
      - MqttBroker__BootstrapCredentials__0__ApiKey=${MQTT_BOOTSTRAP_KEY_CARIBE:?MQTT_BOOTSTRAP_KEY_CARIBE es obligatorio}
      - MqttBroker__BootstrapCredentials__1__TenantCode=DOM-GLP
      - MqttBroker__BootstrapCredentials__1__ApiKey=${MQTT_BOOTSTRAP_KEY_GLP:-}
      - MqttBroker__BootstrapCredentials__2__TenantCode=SMART-ACT
      - MqttBroker__BootstrapCredentials__2__ApiKey=${MQTT_BOOTSTRAP_KEY_SMART:-}
      # Gateway TCP binario para trackers GPS
      - TcpGateway__Enabled=true
      - TcpGateway__Port=5023
      # El cliente de suscripción a broker externo queda deshabilitado (broker embebido).
      - Mqtt__ExternalSubscriptionEnabled=false
      - Jwt__SecretKey=${JWT_SECRET:?JWT_SECRET es obligatorio}
      - Jwt__Issuer=${JWT_ISSUER:-IoT-SaaS-Platform}
      - Jwt__Audience=${JWT_AUDIENCE:-IoT-Frontend}
      # Contraseña inicial de administradores sembrados. OBLIGATORIA en producción:
      # si falta, el API falla al arrancar (no se autogenera ni se loguea ningún secreto).
      - Seed__AdminPassword=${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD es obligatorio en producción}
      # Alta de ORGANIZACIÓN + ADMINISTRADOR inicial en una BD de producción LIMPIA
      # (Bootstrap:Tenants). Idempotente: si ya existen no los recrea ni resetea la contraseña.
      # El admin usa SEED_ADMIN_PASSWORD (arriba) y la cambia en el primer inicio de sesión.
      # Para más organizaciones, repetir con índices __1__, __2__ (cada Code debería coincidir
      # con una MQTT_BOOTSTRAP_KEY_* para que su credencial de ingesta también quede sembrada).
      - Bootstrap__Tenants__0__Code=${BOOTSTRAP_TENANT_CODE:-CARIBE-LOG}
      - Bootstrap__Tenants__0__Name=${BOOTSTRAP_TENANT_NAME:-Logística y Transporte Caribe}
      - Bootstrap__Tenants__0__AdminUsername=${BOOTSTRAP_ADMIN_USERNAME:-admin}
      - Bootstrap__Tenants__0__AdminEmail=${BOOTSTRAP_ADMIN_EMAIL:-admin@iot.caribe}
      # Orígenes CORS del frontend (obligatorio en prod). Coma-separados vía índices.
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:?FRONTEND_ORIGIN es obligatorio (dominio del frontend)}
      - AllowedHosts=${ALLOWED_HOSTS:-*}
      - Email__SmtpServer=${SMTP_SERVER:-smtp.gmail.com}
      - Email__Port=${SMTP_PORT:-587}
      - Email__SenderEmail=${SMTP_USER:-noreply@iot.caribe}
      - Email__SenderPassword=${SMTP_PASSWORD:-}
      - Email__SenderName=${SMTP_SENDER_NAME:-IoT SaaS Caribe}
      - Email__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - TZ=America/Santo_Domingo
    networks:
      - iot-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  iot-worker:
    build:
      context: .
      dockerfile: Worker.Dockerfile
    container_name: iot-telemetry-worker
    restart: unless-stopped
    depends_on:
      iot-postgres:
        condition: service_healthy
      iot-redis:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__Postgres=Host=iot-postgres-db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB es obligatorio};Username=${APP_DB_USER:-iot_app};Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD es obligatorio}
      - Platform__Rls__Enforce=${RLS_ENFORCE:-true}
      - ConnectionStrings__Redis=iot-redis-db:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio},abortConnect=false
      - Redis__ConnectionString=iot-redis-db:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio},abortConnect=false
      # El worker sólo ejecuta retención de datos. El broker MQTT y el gateway TCP
      # viven en iot-api (AddDeviceFacingGateways). No bindea 1883 ni 5023.
      - Mqtt__ExternalSubscriptionEnabled=false
      - Worker__HeartbeatFile=/tmp/worker-heartbeat
      - TZ=America/Santo_Domingo
    networks:
      - iot-network
    healthcheck:
      # Liveness por latido a archivo (el worker no expone HTTP). Unhealthy si >120s sin refrescar.
      test: ["CMD-SHELL", "test -f /tmp/worker-heartbeat && [ $$(( $$(date +%s) - $$(cat /tmp/worker-heartbeat) )) -lt 120 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      resources:
        limits:
          memory: 512M

  iot-simulator:
    profiles: ["dev", "simulation"]
    build:
      context: .
      dockerfile: Simulator.Dockerfile
    container_name: iot-device-simulator
    restart: "no"
    depends_on:
      iot-api:
        condition: service_healthy
    environment:
      - DOTNET_ENVIRONMENT=Development
      # El simulador es un CLIENTE MQTT que se conecta al broker embebido de iot-api. Abre
      # una conexion POR TENANT con la credencial de bootstrap de ese tenant: una credencial
      # acotada a un tenant ya no puede publicar como equipos de otro (MEDIUM-2). Las mismas
      # claves que el broker hashea en cada Tenant.
      - Mqtt__Host=iot-backend-api
      - Mqtt__Port=1883
      - MqttBroker__BootstrapCredentials__0__TenantCode=CARIBE-LOG
      - MqttBroker__BootstrapCredentials__0__ApiKey=${MQTT_BOOTSTRAP_KEY_CARIBE:?MQTT_BOOTSTRAP_KEY_CARIBE es obligatorio}
      - MqttBroker__BootstrapCredentials__1__TenantCode=DOM-GLP
      - MqttBroker__BootstrapCredentials__1__ApiKey=${MQTT_BOOTSTRAP_KEY_GLP:-}
      - MqttBroker__BootstrapCredentials__2__TenantCode=SMART-ACT
      - MqttBroker__BootstrapCredentials__2__ApiKey=${MQTT_BOOTSTRAP_KEY_SMART:-}
      - Simulator__IntervalSeconds=4
    networks:
      - iot-network

volumes:
  # Almacen OTA montado en /app/storage del contenedor iot-api, que corre como appuser
  # (uid 1000) por el endurecimiento E7. El Dockerfile crea /app/storage/firmware con dueno
  # appuser para que un volumen NUEVO herede esa propiedad al inicializarse. Un volumen YA
  # creado por una imagen anterior (sin /app/storage) quedo root:root y NO lo arregla
  # reconstruir la imagen: Docker solo copia la propiedad al inicializar un volumen vacio.
  # Al desplegar este arreglo hay que RECREAR el volumen (no hay firmware que perder porque
  # la subida nunca funciono en el contenedor endurecido):
  #   docker compose down && docker volume rm iotapi_iot_firmware && docker compose up -d --build
  iot_firmware:
    driver: local
  iot_dataprotection:
    driver: local
  iot_postgres_data:
    driver: local
  iot_postgres_backups:
    driver: local
  iot_redis_data:
    driver: local
  iot_logs:
    driver: local

networks:
  iot-network:
    name: iot-network
    driver: bridge
